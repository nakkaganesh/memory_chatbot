[project]
name = "memory-chatbot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.6",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]